<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Kali Linux — Herramientas de análisis forense</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--card:#0f1824;--ln:#1f3049;--bl:#5b9dff;--gr:#3ddc97;--or:#ffa94d;--tx:#e8eef6;--mu:#8c9bb0;--f:'Space Grotesk',Arial,sans-serif;--m:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03060b;overflow:hidden;font-family:var(--f);color:var(--tx)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#st{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1200px 700px at 80% 0%,#0e1d36,var(--bg))}
#cv{position:absolute;inset:0}
.s{position:absolute;inset:0;padding:110px 128px 120px;display:flex;flex-direction:column;gap:40px;visibility:hidden}
.s.on{visibility:visible;z-index:2}
.s.out{visibility:visible;z-index:1;animation:out .7s cubic-bezier(.7,0,.3,1) both}
@keyframes out{to{opacity:0;transform:translateX(-120px) scale(.96);filter:blur(10px)}}
.s.on{animation:inn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes inn{from{opacity:0;transform:translateX(120px) scale(1.03);filter:blur(10px)}}
.a{opacity:0}
.s.on .a{animation:up .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.35s + var(--i,0)*.12s)}
.s.on .a.l{animation-name:lf}.s.on .a.z{animation-name:zm}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1}}
@keyframes lf{from{opacity:0;transform:translateX(-90px)}to{opacity:1}}
@keyframes zm{from{opacity:0;transform:scale(.6)}to{opacity:1}}
h1{font-size:176px;line-height:1;font-weight:700;letter-spacing:-3px}
h2{font-size:72px;font-weight:700;line-height:1.1}
h3{font-size:38px;font-weight:700;line-height:1.15}
p{font-size:28px;color:var(--mu);line-height:1.4}
.m{font-family:var(--m);color:var(--gr);font-size:28px}
.bar{display:block;width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bl),var(--gr));transform-origin:0 0;margin-top:-18px}
.s.on .bar{animation:bar 1s .5s cubic-bezier(.16,1,.3,1) both}
@keyframes bar{from{transform:scaleX(0)}}
.ch{display:inline-block;opacity:0}
.s.on .ch{animation:ch .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.4s + var(--j)*.06s)}
@keyframes ch{from{opacity:0;transform:translateY(80px) rotate(8deg);filter:blur(12px)}to{opacity:1}}
.c{background:rgba(15,24,36,.78);border:1px solid var(--ln);border-radius:22px;padding:34px 38px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(8px)}
.g{display:grid;gap:36px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
ul{list-style:none;display:flex;flex-direction:column;gap:14px;font-size:30px}
li::before{content:"›";color:var(--gr);margin-right:14px;font-weight:700}
.big{font-size:104px;font-weight:700;color:var(--gr);line-height:1;text-shadow:0 0 40px rgba(61,220,151,.35)}
.num{font-size:84px;font-weight:700;color:var(--bl);line-height:1}
.chip{font-family:var(--m);font-size:28px;padding:10px 16px;border-radius:10px;background:#0a1220;border:1px solid var(--ln);width:max-content;max-width:100%}
.warn{border-color:var(--or);animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 50px rgba(255,169,77,.3)}}
.s.on .warn.a{animation:up .9s cubic-bezier(.16,1,.3,1) both,pu 2.4s 1.5s ease-in-out infinite;animation-delay:calc(.35s + var(--i)*.12s),0s}
.logo{position:absolute;width:460px;height:460px;object-fit:contain;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px)}}
.ring{position:absolute;width:560px;height:560px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0,var(--bl) 30%,var(--gr) 45%,transparent 50%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.term{background:#04070c;border:1px solid var(--ln);border-radius:22px;overflow:hidden;font-family:var(--m);font-size:29px;line-height:1.55}
.tb{display:flex;gap:12px;align-items:center;padding:18px 26px;background:#0b1320;color:var(--mu);font-size:24px}
.tb i{width:16px;height:16px;border-radius:50%;background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840;margin-right:14px}
.tbody{padding:28px 36px;min-height:600px}.ln{white-space:pre;min-height:45px}.cm{color:var(--mu)}.pr{color:var(--gr)}
.cu{display:inline-block;width:14px;height:28px;background:var(--gr);vertical-align:-4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sp .c{transition:all .5s}.sp .c.hl{border-color:var(--gr);box-shadow:0 0 40px rgba(61,220,151,.25);background:#10261f}.sp .c.hl .num{color:var(--gr)}

#ct{position:absolute;right:128px;bottom:36px;font:24px var(--m);color:var(--mu);z-index:9}
#nt{position:absolute;left:0;right:0;bottom:0;padding:28px 128px 40px;background:rgba(3,6,11,.94);font-size:30px;line-height:1.5;z-index:10;display:none}

<script>
const NOTES=["[Persona 1] Buenos días, somos el grupo 5 y nos ha tocado Kali Linux. Os vamos a explicar qué es, para qué se usa en análisis forense, cuáles son sus puntos fuertes y sus puntos flojos, y al final haremos un ejemplo práctico con comandos. Yo empiezo con la introducción y los casos de uso, y luego mis compañeros siguen con las características, las ventajas y el ejemplo.", "[Persona 1] Kali Linux es una distribución de Linux basada en Debian que mantiene la empresa OffSec, antes Offensive Security. Salió en 2013 como sustituta de BackTrack. Mucha gente la conoce solo por el hacking ético, pero también trae un montón de herramientas de análisis forense ya instaladas. En total tiene más de 600 herramientas, es gratis y de código abierto.", "[Persona 1] Algunos ejemplos reales de uso. Uno: recuperar archivos borrados, por ejemplo si un trabajador borra un Excel con datos de clientes. Dos: analizar un equipo infectado, haciendo una copia del disco y buscando qué ha dejado el malware. Tres: sacar metadatos de fotos o PDFs con exiftool, que pueden decirnos quién lo hizo, cuándo y hasta dónde. Y cuatro: analizar la memoria RAM con Volatility para ver qué estaba pasando justo en el momento del incidente. Ahora le paso a mi compañero.", "[Persona 2] Sobre las características. Kali se puede usar de muchas formas: instalada en el PC, en un USB Live, en una máquina virtual, dentro de Windows con WSL2, en una Raspberry Pi, con Docker o incluso en Android con NetHunter. Y en cuanto a funciones, ya viene con más de 600 herramientas, hay un metapaquete llamado kali-tools-forensics con todas las forenses, se actualiza constantemente porque es rolling release y es gratis.", "[Persona 2] Una de las cosas más interesantes de Kali para forense es el modo forense del Live. Arrancamos desde el USB, elegimos la opción de modo forense en el menú, y así el sistema no monta automáticamente los discos del equipo ni usa la partición swap. Eso evita modificar la evidencia sin querer. Aun así, en un caso serio lo normal es usar también un bloqueador de escritura por hardware, porque es más fiable.", "[Persona 2] Estas son algunas de las herramientas forenses que trae. Para adquirir imágenes: dc3dd, dcfldd, ddrescue y guymager. Para analizar discos: Autopsy y The Sleuth Kit, que son las que habrán visto otros grupos. Para recuperar archivos: foremost, scalpel, photorec o binwalk. Y para memoria y metadatos: Volatility y exiftool. Si no vienen instaladas, se instalan todas de golpe con este comando.", "[Persona 3] Vamos con lo bueno y lo malo. Lo bueno: es gratis, tiene todas las herramientas en un solo sitio, el modo forense, funciona en muchas plataformas y tiene muchísima comunidad y documentación. Lo malo: no es una distro pensada solo para forense, CAINE está más enfocada a eso; casi todo es por terminal, así que cuesta al principio; como es rolling release una actualización puede romper algo; no sustituye a un bloqueador de escritura; y la cadena de custodia, es decir, documentar quién toca la evidencia, la tenemos que hacer nosotros a mano.", "[Persona 3] Ahora el ejemplo práctico. Imaginamos que nos dan un pendrive de 8 GB de un equipo sospechoso. Arrancamos Kali en modo forense. Primero identificamos el disco con lsblk y fdisk, y tenemos que fijarnos bien porque si nos equivocamos con if y of podemos sobrescribir datos. Después hacemos la copia bit a bit con dc3dd, que calcula el hash SHA-256 y guarda un log. Por último comprobamos con sha256sum que el hash de la imagen coincide, así demostramos que la copia es idéntica.", "[Persona 4] Con la imagen ya hecha, trabajamos siempre sobre la copia y nunca sobre el original. Con mmls vemos las particiones y con fls listamos los archivos borrados, eso es de The Sleuth Kit. Luego montamos la imagen en solo lectura. Y por último recuperamos fotos y PDFs con foremost y miramos los metadatos con exiftool. Todo esto también se puede hacer en modo gráfico abriendo la imagen en Autopsy.", "[Persona 4] Para terminar. Kali es como un laboratorio completo: tiene todo lo necesario para adquirir, analizar y recuperar evidencias. Es muy buena para aprender y para análisis rápidos, pero en un caso real habría que sumar bloqueador de escritura y llevar bien la cadena de custodia. Y nuestra opinión: empezar es fácil gracias al modo Live, pero hay que entender cada comando antes de ejecutarlo, sobre todo los de copia de discos.", "[Todos] Estas son las fuentes que hemos usado. Muchas gracias por escucharnos, ¿alguna pregunta?"],LOGO='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAWfmNhQlgAABZ+anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFlhqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjE5M2ZlYzY0LWEwNmYtNDdjNS1iODM2LWI4ZmUwNDdmNDRmOAAAAAOTanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuGp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNo8SEUa0OtL8wlcldmgGGL+AAAAGxjYm9yo2lkYzpmb3JtYXRpaW1hZ2UvcG5namluc3RhbmNlSUR4LHhtcDppaWQ6NzY1N2Y3YTYtNTRiZS00MGMyLThlMWItYzE5MmY0YmMzZDhjbHJlbGF0aW9uc2hpcGhwYXJlbnRPZgAAAeJqdW1iAAAAQWp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuYWN0aW9ucy52MgAAAAAYYzJzaMoGeVnyn5+ElyzOZ6TPMWYAAAGZY2JvcqJnYWN0aW9uc4KiZmFjdGlvbmtjMnBhLm9wZW5lZGpwYXJhbWV0ZXJzoWtpbmdyZWRpZW50c4GiY3VybHgtc2VsZiNqdW1iZj1jMnBhLmFzc2VydGlvbnMvYzJwYS5pbmdyZWRpZW50LnYzZGhhc2hYIFlWoUxTqOt74vVRc7MAzZSqu7PTtzm7nVWchfOG0Zr1pGZhY3Rpb254HWNvbS5hbnRocm9waWMuY2xhdWRlLnByb3ZpZGVkanBhcmFtZXRlcnOheB9jb20uYW50aHJvcGljLm9yaWdpbi1jb25maWRlbmNlZ3Vua25vd25rZGVzY3JpcHRpb254ZkNsYXVkZSBwcm92aWRlZCB0aGlzIGZpbGUgYXQgdGhlIHJlcXVlc3Qgb2YgYSB1c2VyIGFuZCBtYXkgaGF2ZSBjcmVhdGVkIG9yIG1vZGlmaWVkIHRoZSBmaWxlIGNvbnRlbnRzLm1zb2Z0d2FyZUFnZW50oWRuYW1lZkNsYXVkZXJhbGxBY3Rpb25zSW5jbHVkZWT1AAAAyGp1bWIAAABAanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5oYXNoLmRhdGEAAAAAGGMyc2hdp4PAn/XZ+XFkib2e1Bt6AAAAgGNib3KlY2FsZ2ZzaGEyNTZjcGFkTQAAAAAAAAAAAAAAAABkaGFzaFggpme/5pRIoLcW3z2EtCGlA/zRLkSq7p93s/uKYjgp5cRkbmFtZW5qdW1iZiBtYW5pZmVzdGpleGNsdXNpb25zgaJlc3RhcnQYIWZsZW5ndGgZFooAAAI+anVtYgAAA {h:()=>{n=0;return `<div class="ring" style="right:130px;top:230px"></div><img class="logo" style="right:180px;top:280px" src="${LOGO}" alt="Logo de Kali Linux"><div style="margin-top:150px"><p ${A('l m')}>$ forensics --start</p><h1 style="margin:18px 0 10px">${L('Kali Linux')}</h1><h3 ${A()} style="font-size:58px;font-weight:500;color:var(--bl)">Herramientas de análisis forense</h3></div><div style="margin-top:auto"><p ${A()} style="font-size:32px">Seguridad y Alta Disponibilidad · 2º ASIR · Grupo 5</p><p ${A()} style="font-size:34px;color:var(--tx);margin-top:10px">Darío Salas · Rafael Rodríguez · Maximiliano Rojas · Luis Zamudio</p></div>`}},
{h:()=>H('¿Qué es Kali Linux?')+`<div ${A('c l')}><span class="m">DEFINICIÓN</span><p style="font-size:34px;color:var(--tx)">Distribución GNU/Linux basada en Debian, creada y mantenida por OffSec (Offensive Security). Nació en 2013 como sucesora de BackTrack y está pensada para auditorías de seguridad, pentesting y análisis forense digital. Es gratuita y de código abierto.</p></div><div class="g g3"><div ${A('c z')}><div class="big" data-n="2013">2013</div><p>primera versión (sucesora de BackTrack)</p></div><div ${A('c z')}><div class="big"><span data-n="600">600</span>+</div><p>herramientas incluidas</p></div><div ${A('c z')}><div class="big">Debian</div><p>base del sistema (rolling release)</p></div></div>`},
{h:()=>H('Casos comunes de uso')+`<div class="g g2" style="flex:1">${[['Recuperar archivos borrados','Un empleado borra un Excel de clientes: se intenta recuperar con foremost o PhotoRec.'],['Equipo infectado','Sacamos una imagen del disco de un PC con malware y buscamos sus rastros.'],['Metadatos','Con exiftool vemos autor, fecha y hasta GPS de una foto o PDF filtrado.'],['Memoria RAM','Volatility muestra los procesos y conexiones que había durante el incidente.']].map((x,i)=>card(`<span class="m" style="display:block;margin-bottom:8px">0${i+1}</span>${x[0]}`,x[1],i%2?'c z':'c l')).join('')}</div>`},

const sl=document.getElementById('sl'),st=document.getElementById('st'),nt=document.getElementById('nt');
let cur=-1,tok=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
SL.forEach((s,i)=>{const e=document.createElement('section');e.className='s';e.innerHTML=s.h();sl.appendChild(e);s.e=e});
function fit(){const b=getComputedStyle(document.body),h=innerHeight-parseFloat(b.paddingTop)-parseFloat(b.paddingBottom),k=Math.min(innerWidth/1920,h/1080);st.style.transform=`scale(${k})`;st.style.left=(innerWidth-1920*k)/2+'px';st.style.top=parseFloat(b.paddingTop)+(h-1080*k)/2+'px'}
addEventListener('resize',fit);fit();
async function typeTerm(s,my){const box=s.e.querySelector('#tm');box.innerHTML='';const cu=document.createElement('span');cu.className='cu';await sleep(1400);
 for(const raw of s.t){if(my!=tok)return;let k=null,l=raw;if(l.includes('|')){[l,k]=l.split('|')}
  const d=document.createElement('div');d.className='ln';box.appendChild(d);const c=l[0]=='#'?'cm':l[0]=='$'?'pr':'';let txt=l.slice(1);
  if(l[0]=='$'){const p=document.createElement('span');p.className='pr';p.textContent='$ ';d.appendChild(p);}
  const sp=document.createElement('span');sp.className=l[0]=='#'?'cm':'';d.appendChild(sp);d.appendChild(cu);
  if(l[0]=='#'&&k!==null||l[0]=='#'&&raw.startsWith('#1')||l[0]=='#'&&raw.startsWith('#4')){const i=k===null?0:+k;s.e.querySelectorAll('.sp .c')[i]?.classList.add('hl')}
  for(const ch of txt){if(my!=tok)return;sp.textContent+=ch;await sleep(l[0]=='#'?14:32)}
  await sleep(l[0]=='#'?250:520)}}
async function typeOne(el,my){const t=el.dataset.t;el.textContent='';await sleep(1800);for(const ch of t){if(my!=tok)return;el.textContent+=ch;await sleep(45)}}
function count(e){const to=+e.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0-600)/1800,1);e.textContent=Math.round(to*(1-Math.pow(1-Math.max(p,0),4)));if(p<1)requestAnimationFrame(f)})(t0)}
function go(i){if(i<0||i>=SL.length||i==cur)return;const o=cur>=0?SL[cur].e:null,s=SL[i];tok++;
 if(o){o.classList.remove('on');o.classList.add('out');setTimeout(()=>o.classList.remove('out'),700)}
 s.e.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));s.e.classList.remove('on');void s.e.offsetWidth;s.e.classList.add('on');cur=i;
 s.e.querySelectorAll('[data-n]').forEach(count);const my=tok;if(s.t)typeTerm(s,my);s.e.querySelectorAll('.ty').forEach(e=>typeOne(e,my));
 document.getElementById('pg').style.width=(i+1)/SL.length*100+'%';document.getElementById('ct').textContent=(i+1)+' / '+SL.length;nt.textContent=NOTES[i]||''}
const nx=()=>go(cur+1),pv=()=>go(cur-1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();nx()}else if(['ArrowLeft','PageUp'].includes(e.key))pv();else if(e.key=='Home')go(0);else if(e.key=='End')go(SL.length-1);else if(e.key=='n'||e.key=='N')nt.style.display=nt.style.display=='block'?'none':'block';else if(e.key=='f'||e.key=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
addEventListener('click',e=>{e.clientX>innerWidth*.3?nx():pv()});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)d<0?nx():pv()});
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),P=Array.from({length:70},()=>({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}));
(function f(){cx.clearRect(0,0,1920,1080);P.forEach((a,i)=>{a.x=(a.x+a.vx+1920)%1920;a.y=(a.y+a.vy+1080)%1080;cx.fillStyle='rgba(91,157,255,.5)';cx.fillRect(a.x,a.y,3,3);for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<200){cx.strokeStyle=`rgba(91,157,255,${.12*(1-d/200)})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}});requestAnimationFrame(f)})();
go(0);
